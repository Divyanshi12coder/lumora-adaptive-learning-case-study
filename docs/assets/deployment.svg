<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Lumora CI and deployment</title>
<desc id="desc">GitHub repository to GitHub Actions CI, then deploy targets: Vercel for the React SPA and Render for the Docker web service with Render PostgreSQL and pgvector; plus a local docker compose option.</desc>
<style>
.t{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.s{font-family:Georgia, 'Times New Roman', serif}
.m{font-family:ui-monospace, Menlo, Consolas, monospace}
.flow{stroke-dasharray:5 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}
.pulse{animation:pu 3.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#772233" flood-opacity="0.09"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#772233"/></marker></defs>
