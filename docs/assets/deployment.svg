<text x="244" y="414" class="t" font-size="14" fill="#772233" font-weight="700">Local / single host:</text>
<text x="390" y="414" class="t" font-size="14" fill="#3A1F1C">docker compose → nginx (SPA + /api proxy) · FastAPI · pgvector/pgvector:pg16</text>
