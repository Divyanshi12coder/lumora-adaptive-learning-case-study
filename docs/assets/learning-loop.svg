<path d="M160 196 A440 104 0 1 1 1040 196 A440 104 0 1 1 160 196" pathLength="1000" fill="none" stroke="#AE4F5E" stroke-width="8" stroke-linecap="round" class="trail" opacity="0.35"/>
<path d="M160 196 A440 104 0 1 1 1040 196 A440 104 0 1 1 160 196" pathLength="1000" fill="none" stroke="#772233" stroke-width="14" stroke-linecap="round" class="dot"/>
