<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">The Lumora learning loop</title>
<desc id="desc">A closed loop: Learn (adaptive lesson), Practise (personalised quiz), Signals (accuracy, pace, hints, skips, confidence), Engine (support score to strategy), Adapt (difficulty, density, hints, pacing), and back to Learn.</desc>
<style>
.t{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.s{font-family:Georgia, 'Times New Roman', serif}
.m{font-family:ui-monospace, Menlo, Consolas, monospace}
.flow{stroke-dasharray:5 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}
.pulse{animation:pu 3.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

.dot{stroke-dasharray:0.1 999.9;animation:mv 12s linear infinite}
.trail{stroke-dasharray:28 972;animation:mv2 12s linear infinite}
@keyframes mv{to{stroke-dashoffset:-1000}}
@keyframes mv2{from{stroke-dashoffset:28}to{stroke-dashoffset:-972}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#772233" flood-opacity="0.09"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#772233"/></marker></defs>
<rect width="1200" height="360" rx="22" fill="#FFFDF7"/><rect x="0.5" y="0.5" width="1199" height="359" rx="22" fill="none" stroke="#E5DCCF"/>
