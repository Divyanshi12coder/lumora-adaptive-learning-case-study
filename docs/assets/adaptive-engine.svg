<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Lumora adaptive teaching engine</title>
<desc id="desc">Input signals feed five weighted signal families (performance 0.30, mastery 0.25, ML struggle 0.20, behaviour 0.15, momentum 0.10) into a support need from 0 to 1, mapped to a support band (high support, guided, balanced, stretch) and then to a twelve-part teaching strategy.</desc>
<style>
.t{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.s{font-family:Georgia, 'Times New Roman', serif}
.m{font-family:ui-monospace, Menlo, Consolas, monospace}
.flow{stroke-dasharray:5 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}
.pulse{animation:pu 3.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
