<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Lumora system architecture</title>
<desc id="desc">Layered architecture: React 18 TypeScript client calling a FastAPI API over REST with JWT, domain services, an AI layer, RAG and an ML registry, all backed by PostgreSQL 16 with pgvector.</desc>
<style>
.t{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.s{font-family:Georgia, 'Times New Roman', serif}
.m{font-family:ui-monospace, Menlo, Consolas, monospace}
.flow{stroke-dasharray:5 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}
.pulse{animation:pu 3.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
