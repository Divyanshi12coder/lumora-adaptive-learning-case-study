<title id="title">Lumora - adaptive learning, built around the learner</title>
<desc id="desc">Lumora banner: the logo and wordmark, the headline Adaptive learning, built around the learner, and a flow from Learner to Interactions to Learning signals to Adaptive engine to Personalised experience. Built and created by Divyanshi.</desc>
