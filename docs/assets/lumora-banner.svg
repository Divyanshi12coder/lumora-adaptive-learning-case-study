@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

.fa{animation:fa 7s ease-in-out infinite}
.fb{animation:fa 8s ease-in-out -2.5s infinite}
.fc{animation:fa 6.5s ease-in-out -4s infinite}
@keyframes fa{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
