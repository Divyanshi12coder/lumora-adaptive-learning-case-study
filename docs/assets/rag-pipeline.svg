<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Lumora RAG pipeline</title>
<desc id="desc">Ingest: document, extract and validate, chunk, embed, store in pgvector. Retrieve: question, top-24 cosine candidates, re-rank, top-k context, LLM or demo provider, answer with cited sources.</desc>
<style>
.t{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.s{font-family:Georgia, 'Times New Roman', serif}
.m{font-family:ui-monospace, Menlo, Consolas, monospace}
.flow{stroke-dasharray:5 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}
.pulse{animation:pu 3.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#772233" flood-opacity="0.09"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#772233"/></marker></defs>
<rect width="1200" height="420" rx="22" fill="#FFFDF7"/><rect x="0.5" y="0.5" width="1199" height="419" rx="22" fill="none" stroke="#E5DCCF"/>
<text x="32" y="34" class="t" font-size="13" fill="#A0711C" letter-spacing="3" font-weight="700">RETRIEVAL-AUGMENTED GENERATION</text>
<rect x="32" y="50" width="76" height="22" rx="11" fill="#FFF2CC" stroke="#E9B949"/>
<text x="70" y="65" class="t" font-size="12" fill="#772233" text-anchor="middle" letter-spacing="2" font-weight="700">INGEST</text>
<rect x="32" y="226" width="92" height="22" rx="11" fill="#FFF2CC" stroke="#E9B949"/>
<text x="78" y="241" class="t" font-size="12" fill="#772233" text-anchor="middle" letter-spacing="2" font-weight="700">RETRIEVE</text>
<rect x="32" y="82" width="190" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="127" y="116" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Document</text>
<text x="127" y="138" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">lesson or upload</text>
<text x="127" y="156" class="m" font-size="13" fill="#5B3A35" text-anchor="middle">.txt .md .pdf ≤ 5 MB</text>
<rect x="250" y="82" width="200" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="350" y="116" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Extract + validate</text>
<text x="350" y="138" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">extension · magic bytes</text>
<text x="350" y="156" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">UTF-8</text>
<path d="M225 130.0H245" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<rect x="478" y="82" width="190" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="573" y="116" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Chunk</text>
<text x="573" y="138" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">heading-aware</text>
<text x="573" y="156" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">120 words · 30 overlap</text>
<path d="M453 130.0H473" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<rect x="696" y="82" width="240" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="816" y="107" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Embed</text>
<text x="816" y="129" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">384-dim · local hashing</text>
<text x="816" y="147" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">or OpenAI</text>
<text x="816" y="165" class="m" font-size="13" fill="#5B3A35" text-anchor="middle">text-embedding-3-small</text>
<path d="M671 130.0H691" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<path d="M939 130.0H961" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<path d="M966 94V170A101.0 12 0 0 0 1168 170V94" fill="#772233" filter="url(#sh)"/>
<ellipse cx="1067.0" cy="94" rx="101.0" ry="12" fill="#8E2F3F" stroke="#AE4F5E"/>
<text x="1067" y="126" class="s" font-size="16" fill="#FFF9EA" text-anchor="middle" font-weight="700">pgvector</text>
<text x="1067" y="145" class="m" font-size="13" fill="#FFF2CC" text-anchor="middle">vector(384)</text>
<text x="1067" y="163" class="t" font-size="13" fill="#FFF2CC" text-anchor="middle">HNSW cosine</text>
<rect x="32" y="262" width="118" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="91" y="314" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Question</text>
<rect x="174" y="262" width="182" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="265" y="296" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Top-24</text>
<text x="265" y="318" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">candidates</text>
<text x="265" y="336" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">by cosine</text>
<path d="M153 310.0H169" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<rect x="380" y="262" width="214" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="487" y="287" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Re-rank</text>
<text x="487" y="309" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">0.8 · cosine</text>
<text x="487" y="327" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">+ 0.2 · lexical overlap</text>
<text x="487" y="345" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">+ topic boost</text>
<path d="M359 310.0H375" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<rect x="618" y="262" width="140" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="688" y="305" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">Top-k</text>
<text x="688" y="327" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">context</text>
<path d="M597 310.0H613" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<rect x="782" y="262" width="172" height="96" rx="14" fill="#FFFDF7" stroke="#E5DCCF" stroke-width="1" filter="url(#sh)"/>
<text x="868" y="305" class="s" font-size="16" fill="#5F1A29" text-anchor="middle" font-weight="700">LLM / demo</text>
<text x="868" y="327" class="t" font-size="13" fill="#5B3A35" text-anchor="middle">provider</text>
<path d="M761 310.0H777" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<rect x="978" y="262" width="190" height="96" rx="14" fill="#772233" filter="url(#sh)"/>
<text x="1073" y="305" class="s" font-size="16" fill="#FFF9EA" text-anchor="middle" font-weight="700">Answer</text>
<text x="1073" y="327" class="t" font-size="13" fill="#FFF2CC" text-anchor="middle">+ cited sources</text>
<path d="M957 310.0H973" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<path d="M1067.0 186V214Q1067.0 206 1059.0 206H273Q265 206 265 214V257" fill="none" stroke="#772233" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#ah)"/>
<text x="620" y="226" class="t" font-size="13" fill="#A39584" text-anchor="middle" font-style="italic">nearest neighbours</text>
<text x="1176" y="406" class="t" font-size="12" fill="#772233" text-anchor="end" letter-spacing="2" opacity="0.45">LUMORA ✦ BUILT &amp; CREATED BY DIVYANSHI</text>
</svg>
