<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Lumora machine learning pipeline</title>
<desc id="desc">Five models: Bayesian Knowledge Tracing for mastery, logistic regression for struggle, gradient boosting for engagement, a least-squares slope for trend, and K-means for descriptive profiles, each feeding a product decision.</desc>
<style>
.t{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.s{font-family:Georgia, 'Times New Roman', serif}
.m{font-family:ui-monospace, Menlo, Consolas, monospace}
.flow{stroke-dasharray:5 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}
.pulse{animation:pu 3.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:.95}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
